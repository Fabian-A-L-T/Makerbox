services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    env_file:
      - .env
    expose:
    - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./apps/backend/Makerbox.sql:/docker-entrypoint-initdb.d/001-makerbox.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
  
  jobs:
    image: alpine:3.24
    command: crond -f -L /dev/stdout
    volumes:
      - ./apps/backend/crontab:/etc/crontabs/root:ro
    depends_on:
      - backend
  
  backend:
    build:
      context: ./apps/backend/
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    volumes:
      - uploads-data:/workspace/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./apps/frontend/
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  uploads-data: